[tool.poetry]
name = "patchline"
version = "0.1.0"
description = "Vendor-side changelog-to-PR propagation, built on the Sneferu engine."
authors = ["Patchline Operator <ops@patchline.example>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "patchline", from = "src" }]
include = [
    "src/patchline/templates/**/*.html",
    "src/patchline/static/**/*",
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110,<1.0"
uvicorn = { extras = ["standard"], version = ">=0.29,<1.0" }
sqlalchemy = ">=2.0,<3.0"
alembic = ">=1.13,<2.0"
jinja2 = ">=3.1,<4.0"
httpx = ">=0.27,<1.0"
PyJWT = { extras = ["crypto"], version = ">=2.8,<3.0" }
apscheduler = ">=3.10,<4.0"
unidiff = ">=0.7,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]
